version: "3"

services:
  fulltest:
    image: duckphp/test-php84:latest
    build:
      context: ../..
      dockerfile: docker/test-php84/Dockerfile
    working_dir: /DATA
    volumes:
      - ../../:/DATA
      - vendor:/DATA/vendor
      - composer-cache:/tmp/composer
      - ./test_reports:/DATA/test_reports
      - ./test_coveragedumps:/DATA/test_coveragedumps
    entrypoint:
      - /bin/sh
      - -c
      - redis-server --requirepass 123456 --save "" --appendonly no --daemonize yes && exec "$$@"
      - docker-entrypoint
    environment:
      - COMPOSER_HOME=/tmp/composer
      - XDEBUG_MODE=coverage
    extra_hosts:
      - "redis:127.0.0.1"
    # 与 test-php74 的唯一差别：最后一步用 vendor/bin/phpunit，而不是 composer exec phpunit
    # （本镜像装的是 Composer 2.8，`exec` 子命令在 2.x 后续版本里已经被移除）。
    command:
      - sh
      - -c
      - |
        cd /DATA &&
        rm -f /DATA/composer.lock &&
        composer update --no-interaction --prefer-dist --no-scripts &&
        vendor/bin/phpunit
volumes:
  composer-cache:
  vendor:
