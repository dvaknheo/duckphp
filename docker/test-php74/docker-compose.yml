version: "3"

services:
  fulltest:
    build:
      context: ../..
      dockerfile: docker/test-php74/Dockerfile
    working_dir: /DATA
    volumes:
      - ../../:/DATA
      - vendor:/DATA/vendor
      - data-for-tests74:/DATA/tests/data_for_tests
      - composer-cache:/tmp/composer
      - ./test_reports:/DATA/test_reports
      - ./test_coveragedumps:/DATA/test_coveragedumps
    entrypoint:
      - /bin/sh
      - -c
      - redis-server --requirepass 123456 --save "" --appendonly no --daemonize yes && exec "$$@"
      - docker-entrypoint
    environment:
      - COMPOSER_HOME=/tmp/composer
      - XDEBUG_MODE=coverage
    extra_hosts:
      - "redis:127.0.0.1"
    comm command:
      - sh
      - -c
      - |
        cd /DATA &&
        rm -f /DATA/composer.lock &&
        composer update --no-interaction --prefer-dist --no-scripts &&
        composer exec phpunitvolumes:

  composer-cache:
  vendor:
  for-tests74: